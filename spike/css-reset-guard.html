<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>reset-guard</title>
<style>/* hostile host reset — the report's repro */ * { padding: 0; margin: 0; }</style>
</head><body>
<div id="ed"></div>
<pre id="out">loading</pre>
<script type="module">
import RichEditor from '/dist/rich-editor.esm.js';
window.ed = new RichEditor('#ed', {
  theme: 'light',
  content: '<p>x <video class="inserted-video" src="https://example.com/clip.mp4"></video></p>'
});
setTimeout(() => {
  const g = (sel, prop) => {
    const el = document.querySelector(sel);
    return el ? getComputedStyle(el).getPropertyValue(prop) : 'MISSING';
  };
  const res = {
    videoPopupPad: g('.video-popup', 'padding-top'),
    imagePopupPad: g('.image-popup', 'padding-top'),
    linkPopupPad: g('.link-popup', 'padding-top'),
    inputPad: g('.yjd-input', 'padding-top'),
    confirmBtnPadL: g('.yjd-button-confirm', 'padding-left'),
    videoMaxH: g('.inserted-video', 'max-height'),
  };
  document.getElementById('out').textContent = JSON.stringify(res);
  window.__done = true;
}, 800);
</script>
</body></html>
