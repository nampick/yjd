<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>css-state-matrix</title></head>
<body>
<div id="ed"></div>
<pre id="out">loading</pre>
<script type="module">
import RichEditor from '/dist/rich-editor.esm.js';
window.ed = new RichEditor('#ed', { theme: 'light', sidePanel: true });

// Rewrite :hover/:focus selectors to class hooks so states can be forced from
// JS. Applied identically in the before and after runs, so a zero diff still
// proves the CSS edit preserved every internal cascade outcome.
function rewriteStates() {
  document.querySelectorAll('style').forEach((st) => {
    if (st.textContent.includes(':hover') || st.textContent.includes(':focus')) {
      st.textContent = st.textContent
        .replaceAll(':hover', '.__hov')
        .replaceAll(':focus-within', '.__focw')
        .replaceAll(':focus-visible', '.__focv')
        .replaceAll(':focus', '.__foc');
    }
  });
}

const PROPS = ['background-color', 'color', 'fill', 'stroke', 'border-top-color', 'padding-top', 'padding-left'];
const TARGETS = [
  '.rich-editor-toolbar-btn', '.block-toolbar-btn', '.table-toolbar-btn',
  '.list-button', '.custom-select-item-button', '.table-grid-cell',
  '.image-button', '.yjd-input',
  '.link-popup-content', '.image-popup-content', '.video-popup-content',
  '.tag-popup-content', '.table-popup-content', '.import-popup-content',
];

function keyFor(el, root) {
  // Stable identity: selector class + index within match list.
  return el.__k;
}

function sample(state) {
  const rows = {};
  for (const sel of TARGETS) {
    const els = [...document.querySelectorAll(sel)];
    els.forEach((el, i) => {
      el.__k = sel + '#' + i;
      const rec = {};
      const parts = [el, el.querySelector('svg'), el.querySelector('svg path'),
                     el.querySelector('svg rect'), el.querySelector('svg [fill]')];
      parts.forEach((p, pi) => {
        if (!p) return;
        const cs = getComputedStyle(p);
        PROPS.forEach((prop) => { rec[pi + ':' + prop] = cs.getPropertyValue(prop); });
      });
      rows[state + '|' + el.__k] = rec;
    });
  }
  return rows;
}

setTimeout(() => {
  rewriteStates();
  const all = {};
  const stateSets = [[], ['__hov'], ['active'], ['active', '__hov'], ['__foc']];
  for (const classes of stateSets) {
    const stateName = classes.join('+') || 'base';
    const touched = [];
    for (const sel of TARGETS) {
      document.querySelectorAll(sel).forEach((el) => {
        classes.forEach((c) => el.classList.add(c));
        touched.push([el, classes]);
      });
    }
    Object.assign(all, sample(stateName));
    touched.forEach(([el, cls]) => cls.forEach((c) => el.classList.remove(c)));
  }
  document.getElementById('out').textContent = JSON.stringify(all);
  window.__done = true;
}, 800);
</script>
</body></html>
